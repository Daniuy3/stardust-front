name: Stardust Front Image

on:
  push:
    branches: [ "master" ]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch tags
        run: git fetch --tags --force

      - name: Git Semantic Version
        id: version
        uses: PaulHatch/semantic-version@v4.0.3
        with:
          major_pattern: "major("
          minor_pattern: "feat("

      - name: Show calculated version
        run: |
          echo "version=${{ steps.version.outputs.version }}"
          echo "major=${{ steps.version.outputs.major }}"
          echo "minor=${{ steps.version.outputs.minor }}"
          echo "patch=${{ steps.version.outputs.patch }}"

      - name: Docker Login
        env:
          DOCKER_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

      - name: Build Docker Image
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker build -t daniuy/stardust-front:$NEW_VERSION .
          docker build -t daniuy/stardust-front:latest .

      - name: Push Docker Image
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push daniuy/stardust-front:$NEW_VERSION
          docker push daniuy/stardust-front:latest

      - name: Create and push git tag
        env:
          NEW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"
